<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard - Reprompt OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        .dashboard-app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,10,15,0.95);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .app-header h1 i { color: #f59e0b; }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 6px 15px;
            border-radius: 30px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #f59e0b, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .user-info { font-size: 13px; }
        .user-name { font-weight: 600; }
        .user-level { font-size: 10px; color: #a0a0b0; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); border-color: rgba(245,158,11,0.3); }
        .stat-value { font-size: 28px; font-weight: bold; color: #f59e0b; }
        .stat-label { font-size: 11px; color: #a0a0b0; margin-top: 4px; }
        
        .xp-bar-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            height: 8px;
            margin: 8px 0;
            overflow: hidden;
        }
        .xp-bar-fill {
            background: linear-gradient(90deg, #f59e0b, #8b5cf6);
            height: 100%;
            border-radius: 20px;
            width: 0%;
            transition: width 0.5s;
        }
        
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 16px;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        canvas { max-height: 180px; width: 100%; }
        
        .top-list {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 16px;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .list-item:last-child { border-bottom: none; }
        .list-item-left { display: flex; align-items: center; gap: 10px; }
        .list-item-icon { width: 28px; text-align: center; }
        .list-item-name { font-size: 13px; }
        .list-item-value { font-size: 12px; color: #f59e0b; font-weight: 500; }
        
        .recomendacion-card {
            background: linear-gradient(135deg, rgba(245,158,11,0.1), rgba(139,92,246,0.1));
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(245,158,11,0.3);
        }
        .recomendacion-texto {
            font-size: 13px;
            line-height: 1.5;
            color: #e0e0e0;
        }
        
        .insignias-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }
        .insignia {
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .insignia.locked { opacity: 0.4; }
        
        .btn-sm {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            background: #f59e0b;
            color: #0a0a0f;
            transition: all 0.2s;
        }
        .btn-sm:hover { background: #e08e0a; transform: translateY(-2px); }
        
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px 20px;
            min-height: 0;
        }
        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f59e0b;
            color: #0a0a0f;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .app-content::-webkit-scrollbar { width: 6px; }
        .app-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .app-content::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 3px; }
        @media (max-width: 750px) { .two-columns { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div class="dashboard-app">
    <div class="app-header">
        <h1><i class="fas fa-chart-line"></i> Dashboard</h1>
        <div class="user-profile">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-info">
                <div class="user-name" id="userName">Usuario</div>
                <div class="user-level" id="userLevel">Nivel 1</div>
            </div>
        </div>
    </div>
    <div class="app-content" id="contenidoDinamico"></div>
</div>

<script>
    // ==================== ESTADO ====================
    let datos = {
        proyectos: [],
        habitos: [],
        usuario: { nivel: 1, xp: 0, insignias: [], nombre: 'Usuario' },
        perfil: { nombre: 'Usuario', objetivo: 'equilibrio', tiempo: 'medio' }
    };
    let graficoTareas = null;
    let graficoHabitos = null;
    
    // ==================== CARGA DE DATOS ====================
    function cargarTodosLosDatos() {
        // Cargar datos de Metas
        let metasGuardado = localStorage.getItem('metas_proyectos_v6');
        if (metasGuardado) {
            datos.proyectos = JSON.parse(metasGuardado);
        } else {
            datos.proyectos = [];
        }
        
        // Cargar datos de Hábitos
        let habitosGuardado = localStorage.getItem('habitos_v4');
        if (habitosGuardado) {
            datos.habitos = JSON.parse(habitosGuardado);
        } else {
            datos.habitos = [];
        }
        
        // Cargar datos de Usuario (de Metas)
        let usuarioGuardado = localStorage.getItem('metas_usuario_v1');
        if (usuarioGuardado) {
            let usuarioData = JSON.parse(usuarioGuardado);
            datos.usuario.nivel = usuarioData.nivel || 1;
            datos.usuario.xp = usuarioData.xp || 0;
            datos.usuario.insignias = usuarioData.insignias || [];
        }
        
        // Cargar perfil de Hábitos
        let perfilGuardado = localStorage.getItem('habitos_perfil');
        if (perfilGuardado) {
            datos.perfil = JSON.parse(perfilGuardado);
        }
        datos.usuario.nombre = datos.perfil.nombre || 'Usuario';
    }
    
    // ==================== CÁLCULO DE MÉTRICAS ====================
    function calcularTotalMetas() {
        return datos.proyectos.length;
    }
    
    function calcularMetasCompletadas() {
        return datos.proyectos.filter(p => p.completado).length;
    }
    
    function calcularTotalHabitos() {
        return datos.habitos.length;
    }
    
    function calcularRachaGeneral() {
        let rachaTotal = 0;
        for (let h of datos.habitos) {
            rachaTotal += (h.racha || 0);
        }
        return rachaTotal;
    }
    
    function calcularMejorRacha() {
        let mejor = 0;
        for (let h of datos.habitos) {
            if ((h.mejorRacha || 0) > mejor) mejor = h.mejorRacha;
        }
        return mejor;
    }
    
    function calcularConsistenciaGeneral() {
        let totalCompletados = 0;
        let totalPosibles = 0;
        for (let h of datos.habitos) {
            if (h.historial) {
                totalCompletados += Object.keys(h.historial).length;
                totalPosibles += 30;
            }
        }
        return totalPosibles > 0 ? Math.round((totalCompletados / totalPosibles) * 100) : 0;
    }
    
    function calcularTareasUltimos7Dias() {
        let resultado = [0, 0, 0, 0, 0, 0, 0];
        let hoy = new Date();
        for (let i = 6; i >= 0; i--) {
            let fecha = new Date();
            fecha.setDate(hoy.getDate() - (6 - i));
            let fechaStr = fecha.getFullYear() + '-' + (fecha.getMonth()+1).toString().padStart(2,'0') + '-' + fecha.getDate().toString().padStart(2,'0');
            for (let p of datos.proyectos) {
                if (p.tareas) {
                    for (let t of p.tareas) {
                        if (t.completada) {
                            // Simulación: no tenemos fecha exacta de tareas, usamos un estimado
                            resultado[i] += 1;
                        }
                    }
                }
            }
        }
        return resultado;
    }
    
    function calcularHabitosUltimos7Dias() {
        let resultado = [0, 0, 0, 0, 0, 0, 0];
        let hoy = new Date();
        for (let i = 6; i >= 0; i--) {
            let fecha = new Date();
            fecha.setDate(hoy.getDate() - (6 - i));
            let fechaStr = fecha.getFullYear() + '-' + (fecha.getMonth()+1).toString().padStart(2,'0') + '-' + fecha.getDate().toString().padStart(2,'0');
            for (let h of datos.habitos) {
                if (h.historial && h.historial[fechaStr]) {
                    resultado[i]++;
                }
            }
        }
        return resultado;
    }
    
    function obtenerTopHabitos() {
        let copia = [...datos.habitos];
        copia.sort(function(a, b) { return (b.racha || 0) - (a.racha || 0); });
        return copia.slice(0, 3);
    }
    
    function obtenerMetasActivas() {
        return datos.proyectos.filter(p => !p.completado).slice(0, 3);
    }
    
    function generarRecomendacion() {
        let metasActivas = datos.proyectos.filter(p => !p.completado).length;
        let habitosActivos = datos.habitos.length;
        let racha = calcularRachaGeneral();
        let consistencia = calcularConsistenciaGeneral();
        
        if (metasActivas === 0 && habitosActivos === 0) {
            return "✨ ¡Comienza tu viaje! Crea tu primera meta o hábito. Ve a las apps de Metas y Hábitos para empezar.";
        }
        if (racha === 0 && habitosActivos > 0) {
            return "💪 ¡Hoy es un gran día para empezar! Completa al menos un hábito hoy para iniciar tu racha.";
        }
        if (consistencia < 30 && habitosActivos > 0) {
            return "📈 Tu consistencia es del " + consistencia + "%. Intenta completar al menos un hábito cada día. ¡Pequeños pasos generan grandes cambios!";
        }
        if (metasActivas > 0) {
            let metaPendiente = datos.proyectos.find(p => !p.completado);
            if (metaPendiente) {
                return "🎯 Tu meta activa: \"" + metaPendiente.nombre + "\" está al " + (metaPendiente.progreso || 0) + "%. ¡Sigue avanzando!";
            }
        }
        if (racha > 0) {
            return "🔥 Llevas una racha total de " + racha + " días. ¡No la rompas! Cada día cuenta para tu desarrollo personal.";
        }
        return "🌟 Sigue trabajando en tus metas y hábitos. La constancia es la clave del éxito.";
    }
    
    // ==================== RENDERIZADO ====================
    function renderizarDashboard() {
        let totalMetas = calcularTotalMetas();
        let totalHabitos = calcularTotalHabitos();
        let rachaGeneral = calcularRachaGeneral();
        let consistencia = calcularConsistenciaGeneral();
        let mejorRacha = calcularMejorRacha();
        let tareasSemana = calcularTareasUltimos7Dias();
        let habitosSemana = calcularHabitosUltimos7Dias();
        let topHabitos = obtenerTopHabitos();
        let metasActivas = obtenerMetasActivas();
        let recomendacion = generarRecomendacion();
        
        let xpNecesario = 100 * datos.usuario.nivel;
        let xpActual = datos.usuario.xp;
        let xpPorcentaje = Math.min(100, Math.round((xpActual / xpNecesario) * 100));
        
        let html = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${totalMetas}</div><div class="stat-label">Metas Activas</div></div>
                <div class="stat-card"><div class="stat-value">${totalHabitos}</div><div class="stat-label">Hábitos</div></div>
                <div class="stat-card"><div class="stat-value">${rachaGeneral}</div><div class="stat-label">Racha Total 🔥</div></div>
                <div class="stat-card"><div class="stat-value">${consistencia}%</div><div class="stat-label">Consistencia</div></div>
            </div>
            
            <div style="background: rgba(255,255,255,0.03); border-radius: 14px; padding: 16px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span><i class="fas fa-star"></i> Nivel ${datos.usuario.nivel}</span>
                    <span>${xpActual} / ${xpNecesario} XP</span>
                </div>
                <div class="xp-bar-container"><div class="xp-bar-fill" style="width: ${xpPorcentaje}%;"></div></div>
                <div style="font-size: 11px; color: #a0a0b0; margin-top: 5px;">✨ ${xpNecesario - xpActual} XP para el siguiente nivel</div>
            </div>
            
            <div class="two-columns">
                <div class="chart-card">
                    <div class="chart-title"><i class="fas fa-chart-bar"></i> Tareas Completadas (7 días)</div>
                    <canvas id="graficoTareas"></canvas>
                </div>
                <div class="chart-card">
                    <div class="chart-title"><i class="fas fa-chart-line"></i> Hábitos Completados (7 días)</div>
                    <canvas id="graficoHabitos"></canvas>
                </div>
            </div>
            
            <div class="two-columns">
                <div class="top-list">
                    <div class="chart-title"><i class="fas fa-fire"></i> Top Hábitos por Racha</div>
                    ${topHabitos.length === 0 ? '<p style="color:#a0a0b0; text-align:center;">Sin hábitos aún</p>' : 
                        topHabitos.map(h => `
                            <div class="list-item">
                                <div class="list-item-left">
                                    <div class="list-item-icon">${h.categoria === 'salud' ? '💪' : h.categoria === 'productividad' ? '⚡' : h.categoria === 'aprendizaje' ? '📚' : h.categoria === 'bienestar' ? '🧘' : '👥'}</div>
                                    <div class="list-item-name">${escapeHtml(h.nombre)}</div>
                                </div>
                                <div class="list-item-value">${h.racha || 0} días 🔥</div>
                            </div>
                        `).join('')
                    }
                </div>
                <div class="top-list">
                    <div class="chart-title"><i class="fas fa-bullseye"></i> Metas Activas</div>
                    ${metasActivas.length === 0 ? '<p style="color:#a0a0b0; text-align:center;">Sin metas activas</p>' : 
                        metasActivas.map(m => `
                            <div class="list-item">
                                <div class="list-item-left">
                                    <div class="list-item-icon">${m.prioridad === 'alta' ? '🔴' : m.prioridad === 'media' ? '🟡' : '🟢'}</div>
                                    <div class="list-item-name">${escapeHtml(m.nombre)}</div>
                                </div>
                                <div class="list-item-value">${m.progreso || 0}%</div>
                            </div>
                        `).join('')
                    }
                </div>
            </div>
            
            <div class="recomendacion-card">
                <div class="chart-title"><i class="fas fa-robot"></i> Recomendación IA</div>
                <div class="recomendacion-texto">${recomendacion}</div>
            </div>
            
            <div class="top-list" style="margin-bottom: 20px;">
                <div class="chart-title"><i class="fas fa-medal"></i> Insignias Desbloqueadas</div>
                <div class="insignias-grid" id="insigniasGrid"></div>
            </div>
            
            <div style="text-align: center;">
                <button class="btn-sm" onclick="exportarReporteGlobal()"><i class="fas fa-download"></i> Exportar Reporte Global</button>
            </div>
        `;
        
        document.getElementById('contenidoDinamico').innerHTML = html;
        
        // Renderizar insignias
        let insigniasHtml = '';
        let todasInsignias = [
            { id: 'primer_proyecto', nombre: '🌟 Primer Proyecto', icono: 'fa-star' },
            { id: 'racha_7', nombre: '🔥 Racha 7 días', icono: 'fa-fire' },
            { id: 'tareas_10', nombre: '📋 10 Tareas', icono: 'fa-check-circle' },
            { id: 'proyecto_completado', nombre: '🎯 Meta Cumplida', icono: 'fa-trophy' }
        ];
        for (let i of todasInsignias) {
            let desbloqueada = datos.usuario.insignias.includes(i.id);
            insigniasHtml += `<div class="insignia ${!desbloqueada ? 'locked' : ''}"><i class="fas ${i.icono}"></i> ${i.nombre}</div>`;
        }
        document.getElementById('insigniasGrid').innerHTML = insigniasHtml;
        
        // Gráficos
        let diasSemana = ['Hace 6d', 'Hace 5d', 'Hace 4d', 'Hace 3d', 'Ayer', 'Hoy'];
        
        if (graficoTareas) graficoTareas.destroy();
        let ctxTareas = document.getElementById('graficoTareas')?.getContext('2d');
        if (ctxTareas) {
            graficoTareas = new Chart(ctxTareas, {
                type: 'bar',
                data: { labels: diasSemana, datasets: [{ label: 'Tareas', data: tareasSemana.slice(1), backgroundColor: '#f59e0b', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { y: { ticks: { color: '#a0a0b0' } }, x: { ticks: { color: '#a0a0b0' } } } }
            });
        }
        
        if (graficoHabitos) graficoHabitos.destroy();
        let ctxHabitos = document.getElementById('graficoHabitos')?.getContext('2d');
        if (ctxHabitos) {
            graficoHabitos = new Chart(ctxHabitos, {
                type: 'bar',
                data: { labels: diasSemana, datasets: [{ label: 'Hábitos', data: habitosSemana.slice(1), backgroundColor: '#10b981', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#fff' } } }, scales: { y: { ticks: { color: '#a0a0b0' } }, x: { ticks: { color: '#a0a0b0' } } } }
            });
        }
        
        // Actualizar datos de usuario en UI
        document.getElementById('userName').innerText = datos.usuario.nombre;
        document.getElementById('userLevel').innerText = 'Nivel ' + datos.usuario.nivel;
        document.getElementById('userAvatar').innerText = datos.usuario.nombre.charAt(0).toUpperCase();
    }
    
    function exportarReporteGlobal() {
        let now = new Date();
        let contenido = "╔══════════════════════════════════════════════════════════════╗\n";
        contenido += "║         REPORTE GLOBAL - REPROMPT OS                         ║\n";
        contenido += "╚══════════════════════════════════════════════════════════════╝\n\n";
        contenido += `📅 Fecha: ${now.toLocaleDateString('es-ES')}\n`;
        contenido += `👤 Usuario: ${datos.usuario.nombre}\n`;
        contenido += `🏆 Nivel: ${datos.usuario.nivel}\n`;
        contenido += `✨ XP: ${datos.usuario.xp}\n\n`;
        
        contenido += "┌─────────────────────────────────────────────────────────────────┐\n";
        contenido += "│                        RESUMEN GENERAL                         │\n";
        contenido += "└─────────────────────────────────────────────────────────────────┘\n\n";
        contenido += `📁 Metas totales: ${calcularTotalMetas()}\n`;
        contenido += `✅ Metas completadas: ${calcularMetasCompletadas()}\n`;
        contenido += `🔄 Hábitos activos: ${calcularTotalHabitos()}\n`;
        contenido += `🔥 Racha total: ${calcularRachaGeneral()} días\n`;
        contenido += `🏅 Mejor racha: ${calcularMejorRacha()} días\n`;
        contenido += `📊 Consistencia: ${calcularConsistenciaGeneral()}%\n\n`;
        
        contenido += "┌─────────────────────────────────────────────────────────────────┐\n";
        contenido += "│                          TOP HÁBITOS                            │\n";
        contenido += "└─────────────────────────────────────────────────────────────────┘\n\n";
        let top = obtenerTopHabitos();
        for (let h of top) {
            contenido += `📌 ${h.nombre} - ${h.racha || 0} días seguidos\n`;
        }
        contenido += "\n";
        
        contenido += "┌─────────────────────────────────────────────────────────────────┐\n";
        contenido += "│                          METAS ACTIVAS                          │\n";
        contenido += "└─────────────────────────────────────────────────────────────────┘\n\n";
        let metasActivas = datos.proyectos.filter(p => !p.completado);
        for (let m of metasActivas) {
            contenido += `📌 ${m.nombre} - ${m.progreso || 0}% completado\n`;
        }
        contenido += "\n";
        
        contenido += "┌─────────────────────────────────────────────────────────────────┐\n";
        contenido += "│                           INSIGNIAS                             │\n";
        contenido += "└─────────────────────────────────────────────────────────────────┘\n\n";
        for (let i of datos.usuario.insignias) {
            contenido += `🏅 ${i}\n`;
        }
        if (datos.usuario.insignias.length === 0) contenido += "Sin insignias desbloqueadas aún\n";
        contenido += "\n";
        
        contenido += "┌─────────────────────────────────────────────────────────────────┐\n";
        contenido += "│                      RECOMENDACIÓN IA                           │\n";
        contenido += "└─────────────────────────────────────────────────────────────────┘\n\n";
        contenido += generarRecomendacion() + "\n\n";
        
        contenido += "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n";
        contenido += "Reporte generado por Reprompt OS - Sistema de Desarrollo Personal\n";
        
        let blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `reporte_global_${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${now.getDate().toString().padStart(2,'0')}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        mostrarNotificacion('📄 Reporte global exportado');
    }
    
    function mostrarNotificacion(msg) {
        let n = document.createElement('div');
        n.className = 'notification-toast';
        n.innerHTML = msg;
        document.body.appendChild(n);
        setTimeout(function() { if (n && n.remove) n.remove(); }, 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    window.exportarReporteGlobal = exportarReporteGlobal;
    
    document.addEventListener('DOMContentLoaded', function() {
        cargarTodosLosDatos();
        renderizarDashboard();
    });
</script>
</body>
</html>
