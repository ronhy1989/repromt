<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plugin Store - REPROMPT OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,10,15,0.95);
            flex-shrink: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .app-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .app-header h1 i { color: #f59e0b; }
        .wallet-badge {
            background: linear-gradient(135deg, #f59e0b, #8b5cf6);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stat-card:hover { background: rgba(245,158,11,0.1); transform: translateY(-2px); }
        .stat-value { font-size: 24px; font-weight: bold; color: #f59e0b; }
        .stat-label { font-size: 11px; color: #a0a0b0; margin-top: 4px; }
        
        .tabs {
            display: flex;
            gap: 4px;
            padding: 0 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #a0a0b0;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .tab:hover { color: #fff; }
        .tab.active { color: #f59e0b; border-bottom: 2px solid #f59e0b; }
        
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 16px 20px;
            min-height: 0;
        }
        
        .plugins-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .plugin-card {
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            position: relative;
        }
        .plugin-card:hover { transform: translateY(-5px); border-color: #f59e0b; background: rgba(245,158,11,0.05); }
        .plugin-icon { font-size: 48px; margin-bottom: 12px; }
        .plugin-name { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .plugin-desc { font-size: 12px; color: #a0a0b0; margin-bottom: 12px; line-height: 1.4; }
        .plugin-price {
            font-size: 24px;
            font-weight: bold;
            color: #f59e0b;
            margin: 12px 0;
        }
        .plugin-price small { font-size: 12px; color: #a0a0b0; }
        .plugin-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: bold;
        }
        .badge-premium { background: linear-gradient(135deg, #f59e0b, #8b5cf6); }
        .badge-installed { background: #10b981; }
        .badge-demo { background: #3b82f6; }
        
        .plugin-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 8px 0;
            color: #f59e0b;
            font-size: 12px;
        }
        .trial-info {
            font-size: 11px;
            color: #10b981;
            margin-top: 4px;
        }
        
        .btn-buy, .btn-open, .btn-uninstall, .btn-demo {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-size: 13px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #f59e0b, #8b5cf6);
            color: white;
        }
        .btn-buy:hover { transform: translateY(-2px); }
        .btn-demo {
            background: #3b82f6;
            color: white;
        }
        .btn-demo:hover { background: #2563eb; }
        .btn-open {
            background: #10b981;
            color: white;
        }
        .btn-uninstall {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a24;
            border-radius: 24px;
            padding: 24px;
            width: 450px;
            max-width: 90%;
        }
        .payment-methods {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .payment-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
        }
        .payment-btn:hover { background: rgba(245,158,11,0.2); }
        .payment-btn i { font-size: 24px; margin-bottom: 5px; display: block; }
        
        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f59e0b;
            color: #0a0a0f;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .empty-state { text-align: center; padding: 40px; color: #a0a0b0; }
        .app-content::-webkit-scrollbar { width: 6px; }
        .app-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .app-content::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 3px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="header-top">
            <h1><i class="fas fa-store"></i> Plugin Store</h1>
            <div class="wallet-badge" onclick="mostrarInfoMonedas()">
                <i class="fas fa-coins"></i>
                <span id="monedas">0</span> REP
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="pluginsTotal">7</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-value" id="pluginsInstalados">0</div><div class="stat-label">Instalados</div></div>
            <div class="stat-card"><div class="stat-value" id="pluginsPremium">7</div><div class="stat-label">Premium</div></div>
            <div class="stat-card"><div class="stat-value" id="pluginsGratis">0</div><div class="stat-label">Gratuitos</div></div>
        </div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="todos"><i class="fas fa-th-large"></i> Todos</button>
        <button class="tab" data-tab="instalados"><i class="fas fa-check-circle"></i> Instalados</button>
        <button class="tab" data-tab="demo"><i class="fas fa-flask"></i> En prueba</button>
        <button class="tab" data-tab="licencias"><i class="fas fa-key"></i> Mis licencias</button>
    </div>
    
    <div class="app-content" id="contenidoDinamico"></div>
</div>

<!-- Modal de pago -->
<div id="modalPago" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-credit-card"></i> Completar pago</h3>
        <div id="pagoInfo"></div>
        <div class="payment-methods">
            <div class="payment-btn" onclick="procesarPago('stripe')"><i class="fab fa-stripe"></i><span>Stripe</span></div>
            <div class="payment-btn" onclick="procesarPago('mercadopago')"><i class="fas fa-credit-card"></i><span>MercadoPago</span></div>
            <div class="payment-btn" onclick="procesarPago('paypal')"><i class="fab fa-paypal"></i><span>PayPal</span></div>
        </div>
        <div style="text-align: center; margin: 12px 0; color: #a0a0b0;">
            <small>🎁 <strong style="color:#f59e0b;">PROBAR GRATIS</strong> - Demo 3 días sin código</small>
        </div>
        <button class="btn-primary" style="background:#ef4444;" onclick="cerrarModalPago()">Cancelar</button>
    </div>
</div>

<script>
    // ==================== PLUGINS ====================
    const PLUGINS = [
        {
            id: "cuestionarios",
            nombre: "Cuestionarios Premium",
            icono: "📋✨",
            descripcion: "Cuestionarios avanzados de personalidad Big Five, inteligencia emocional, fortalezas, propósito (IKIGAI) y más.",
            precio: 4.99,
            tipo: "premium",
            app_name: "cuestionarios",
            rating: 4.8,
            descargas: 1240,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: true,
            url: "/apps/cuestionarios/index.html"
        },
        {
            id: "profesionales",
            nombre: "Profesionales Premium",
            icono: "👨‍⚕️💼",
            descripcion: "Conecta con terapeutas, coaches y profesionales de la salud mental.",
            precio: 9.99,
            tipo: "premium",
            app_name: "profesionales",
            rating: 4.9,
            descargas: 567,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/profesionales/index.html"
        },
        {
            id: "crisis",
            nombre: "Asistente de Crisis",
            icono: "🆘❤️",
            descripcion: "Herramientas de apoyo emocional para momentos difíciles.",
            precio: 2.99,
            tipo: "premium",
            app_name: "crisis",
            rating: 4.7,
            descargas: 892,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/crisis/index.html"
        },
        {
            id: "musica",
            nombre: "Música Terapéutica",
            icono: "🎵🧘",
            descripcion: "Playlists personalizadas para concentración, relajación y sueño.",
            precio: 3.99,
            tipo: "premium",
            app_name: "musica",
            rating: 4.6,
            descargas: 2150,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/musica/index.html"
        },
        {
            id: "biblioteca",
            nombre: "Biblioteca Personal",
            icono: "📚✨",
            descripcion: "Tu biblioteca personal de libros, audiolibros, cursos y recursos de desarrollo personal.",
            precio: 5.99,
            tipo: "premium",
            app_name: "biblioteca",
            rating: 4.5,
            descargas: 734,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/biblioteca/index.html"
        },
        {
            id: "logros",
            nombre: "Logros Avanzados",
            icono: "🏆✨",
            descripcion: "Insignias exclusivas, trofeos y desafíos semanales.",
            precio: 2.99,
            tipo: "premium",
            app_name: "logros",
            rating: 4.4,
            descargas: 1560,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/logros/index.html"
        },
        {
            id: "comunidad",
            nombre: "Comunidad Premium",
            icono: "👥🌟",
            descripcion: "Acceso a grupos exclusivos, retos semanales y sesiones en vivo.",
            precio: 4.99,
            tipo: "premium",
            app_name: "comunidad",
            rating: 4.7,
            descargas: 982,
            demo_disponible: true,
            dias_demo: 3,
            desarrollado: false,
            url: "/apps/comunidad/index.html"
        }
    ];
    
    let pluginsInstalados = [];
    let pluginsEnDemo = [];
    let licencias = [];
    let monedas = 0;
    let pluginComprando = null;
    let tabActual = 'todos';
    
    // ==================== FUNCIONES ====================
    
    function cargarDatos() {
        try {
            let instalados = localStorage.getItem('repromt_plugins');
            if (instalados) pluginsInstalados = JSON.parse(instalados);
            
            let demos = localStorage.getItem('reprompt_plugins_demo');
            if (demos) {
                let demosObj = JSON.parse(demos);
                pluginsEnDemo = Object.keys(demosObj).map(key => ({
                    id: key,
                    expira: demosObj[key].expira
                }));
            }
            
            let lic = localStorage.getItem('reprompt_licencias');
            if (lic) licencias = JSON.parse(lic);
            let mon = localStorage.getItem('reprompt_monedas');
            if (mon) monedas = parseInt(mon);
            
            let ahora = Date.now();
            pluginsEnDemo = pluginsEnDemo.filter(d => d.expira > ahora);
            actualizarStats();
        } catch(e) {
            console.error('Error cargando datos:', e);
        }
    }
    
    function guardarDatos() {
        try {
            localStorage.setItem('repromt_plugins', JSON.stringify(pluginsInstalados));
            
            let demosObj = {};
            for (let demo of pluginsEnDemo) {
                demosObj[demo.id] = {
                    expira: demo.expira,
                    activado: new Date().toISOString(),
                    dias: 3
                };
            }
            localStorage.setItem('reprompt_plugins_demo', JSON.stringify(demosObj));
            
            localStorage.setItem('reprompt_licencias', JSON.stringify(licencias));
            localStorage.setItem('reprompt_monedas', monedas);
            actualizarStats();
            enviarDatosAsistente();
            renderizarPlugins();
        } catch(e) {
            console.error('Error guardando datos:', e);
        }
    }
    
    function actualizarStats() {
        document.getElementById('pluginsTotal').innerText = PLUGINS.length;
        document.getElementById('pluginsInstalados').innerText = pluginsInstalados.length;
        document.getElementById('pluginsPremium').innerText = PLUGINS.length;
        document.getElementById('pluginsGratis').innerText = 0;
        document.getElementById('monedas').innerText = monedas;
    }
    
    function enviarDatosAsistente() {
        try {
            let datos = {
                plugins_instalados: pluginsInstalados,
                total_instalados: pluginsInstalados.length,
                monedas: monedas
            };
            localStorage.setItem('reprompt_store_data', JSON.stringify(datos));
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'GLOBAL_DATA_UPDATE', app: 'store', data: datos }, '*');
            }
        } catch(e) {}
    }
    
    function estaInstalado(pluginId) {
        return pluginsInstalados.some(p => p === pluginId);
    }
    
    function estaEnDemo(pluginId) {
        return pluginsEnDemo.some(d => d.id === pluginId && d.expira > Date.now());
    }
    
    // ==================== ACTIVAR DEMO Y ABRIR APP ====================
    function activarDemo(plugin) {
        if (estaInstalado(plugin.id)) {
            mostrarNotificacion(`⚠️ ${plugin.nombre} ya está instalado`);
            return;
        }
        if (estaEnDemo(plugin.id)) {
            mostrarNotificacion(`⚠️ Ya tienes una demo activa de ${plugin.nombre}`);
            return;
        }
        
        console.log(`🎁 Activando demo para ${plugin.id}`);
        
        // 1. Guardar demo
        let demosObj = JSON.parse(localStorage.getItem('reprompt_plugins_demo') || '{}');
        demosObj[plugin.id] = {
            expira: Date.now() + (plugin.dias_demo || 3) * 24 * 60 * 60 * 1000,
            activado: new Date().toISOString(),
            dias: plugin.dias_demo || 3
        };
        localStorage.setItem('reprompt_plugins_demo', JSON.stringify(demosObj));
        
        // 2. Marcar como instalado
        let instalados = JSON.parse(localStorage.getItem('repromt_plugins') || '[]');
        if (!instalados.includes(plugin.id)) {
            instalados.push(plugin.id);
            localStorage.setItem('repromt_plugins', JSON.stringify(instalados));
        }
        
        // 3. Actualizar arrays locales
        pluginsInstalados.push(plugin.id);
        pluginsEnDemo.push({
            id: plugin.id,
            expira: Date.now() + (plugin.dias_demo || 3) * 24 * 60 * 60 * 1000
        });
        
        guardarDatos();
        mostrarNotificacion(`🎉 Demo de ${plugin.dias_demo} días activada para ${plugin.nombre}!`, 'success');
        
        // 4. ABRIR LA APP DIRECTAMENTE
        setTimeout(() => {
            // Método 1: Usar el método de REPROMPT OS
            if (window.parent && window.parent.app && window.parent.app.openApp) {
                window.parent.app.openApp(plugin.app_name);
            } 
            // Método 2: Abrir en nueva pestaña
            else {
                window.open(`/apps/${plugin.app_name}/index.html`, '_blank');
            }
        }, 1500);
    }
    
    // ==================== COMPRAR PLUGIN ====================
    function comprarPlugin(plugin) {
        pluginComprando = plugin;
        document.getElementById('pagoInfo').innerHTML = `
            <p><strong>${plugin.nombre}</strong></p>
            <p>Precio: <span style="color:#f59e0b; font-size:24px;">$${plugin.precio}</span> USD</p>
            <p style="font-size:12px; color:#a0a0b0;">Pago único, acceso permanente</p>
        `;
        document.getElementById('modalPago').style.display = 'flex';
    }
    
    function procesarPago(metodo) {
        if (!pluginComprando) return;
        mostrarNotificacion(`🔄 Procesando pago con ${metodo}...`);
        setTimeout(() => {
            let codigoLicencia = `REP-${pluginComprando.id.toUpperCase()}-${Math.random().toString(36).substr(2, 8).toUpperCase()}`;
            licencias.push({
                pluginId: pluginComprando.id,
                codigo: codigoLicencia,
                fecha_compra: new Date().toISOString(),
                metodo: metodo,
                precio: pluginComprando.precio
            });
            
            if (!pluginsInstalados.includes(pluginComprando.id)) {
                pluginsInstalados.push(pluginComprando.id);
            }
            
            guardarDatos();
            cerrarModalPago();
            mostrarNotificacion(`🎉 ¡Compra exitosa! Código: ${codigoLicencia}`, 'success');
            
            setTimeout(() => {
                if (window.parent && window.parent.app && window.parent.app.openApp) {
                    window.parent.app.openApp(pluginComprando.app_name);
                } else {
                    window.open(`/apps/${pluginComprando.app_name}/index.html`, '_blank');
                }
            }, 1500);
            
            pluginComprando = null;
        }, 1500);
    }
    
    function desinstalarPlugin(pluginId) {
        let plugin = PLUGINS.find(p => p.id === pluginId);
        if (!plugin) return;
        if (!confirm(`¿Desinstalar ${plugin.nombre}?`)) return;
        
        pluginsInstalados = pluginsInstalados.filter(p => p !== pluginId);
        pluginsEnDemo = pluginsEnDemo.filter(d => d.id !== pluginId);
        
        let demosObj = JSON.parse(localStorage.getItem('reprompt_plugins_demo') || '{}');
        delete demosObj[pluginId];
        localStorage.setItem('reprompt_plugins_demo', JSON.stringify(demosObj));
        
        guardarDatos();
        mostrarNotificacion(`🗑️ ${plugin.nombre} desinstalado`);
        renderizarPlugins();
    }
    
    function abrirAppInstalada(pluginId) {
        let plugin = PLUGINS.find(p => p.id === pluginId);
        if (plugin) {
            if (window.parent && window.parent.app && window.parent.app.openApp) {
                window.parent.app.openApp(plugin.app_name);
            } else {
                window.open(plugin.url, '_blank');
            }
        }
    }
    
    function mostrarInfoMonedas() {
        mostrarNotificacion(`💰 Tienes ${monedas} REP. Completa metas y hábitos para ganar más!`);
    }
    
    function tiempoRestanteDemo(pluginId) {
        let demo = pluginsEnDemo.find(d => d.id === pluginId);
        if (!demo) return null;
        let restante = demo.expira - Date.now();
        if (restante <= 0) return null;
        let horas = Math.floor(restante / (1000 * 60 * 60));
        if (horas < 24) return `${horas} horas`;
        return `${Math.floor(horas / 24)} días ${horas % 24} horas`;
    }
    
    function cerrarModalPago() { document.getElementById('modalPago').style.display = 'none'; pluginComprando = null; }
    function mostrarNotificacion(msg) { let n = document.createElement('div'); n.className = 'notification-toast'; n.innerHTML = msg; document.body.appendChild(n); setTimeout(() => n.remove(), 2500); }
    
    function renderizarPlugins() {
        let filtrados = [...PLUGINS];
        
        if (tabActual === 'instalados') {
            filtrados = PLUGINS.filter(p => estaInstalado(p.id));
        } else if (tabActual === 'demo') {
            filtrados = PLUGINS.filter(p => estaEnDemo(p.id));
        }
        
        if (filtrados.length === 0) {
            document.getElementById('contenidoDinamico').innerHTML = `<div class="empty-state"><i class="fas fa-store"></i><br>No hay plugins en esta categoría</div>`;
            return;
        }
        
        let html = '<div class="plugins-grid">';
        for (let p of filtrados) {
            let instalado = estaInstalado(p.id);
            let enDemo = estaEnDemo(p.id);
            let tiempoDemo = enDemo ? tiempoRestanteDemo(p.id) : null;
            
            html += `
                <div class="plugin-card">
                    <div class="plugin-badge ${instalado ? 'badge-installed' : 'badge-premium'}">${instalado ? 'Instalado ✓' : 'Premium'}</div>
                    <div class="plugin-icon">${p.icono}</div>
                    <div class="plugin-name">${p.nombre}</div>
                    <div class="plugin-rating"><i class="fas fa-star"></i> ${p.rating} • ${p.descargas} descargas</div>
                    <div class="plugin-desc">${p.descripcion}</div>
                    <div class="plugin-price">$${p.precio} <small>USD</small></div>
                    ${enDemo ? `<div class="trial-info"><i class="fas fa-hourglass-half"></i> Demo: ${tiempoDemo} restantes</div>` : ''}
                    ${instalado ? 
                        `<button class="btn-open" onclick="abrirAppInstalada('${p.id}')"><i class="fas fa-play"></i> Abrir</button>
                         <button class="btn-uninstall" onclick="desinstalarPlugin('${p.id}')"><i class="fas fa-trash"></i> Desinstalar</button>` :
                        `<button class="btn-buy" onclick="comprarPlugin(PLUGINS.find(pl => pl.id === '${p.id}'))"><i class="fas fa-shopping-cart"></i> Comprar $${p.precio}</button>
                         <button class="btn-demo" onclick="activarDemo(PLUGINS.find(pl => pl.id === '${p.id}'))"><i class="fas fa-flask"></i> Probar ${p.dias_demo} días gratis</button>`
                    }
                </div>
            `;
        }
        html += '</div>';
        
        if (tabActual === 'licencias') {
            let licHtml = '<div class="plugins-grid">';
            if (licencias.length === 0) {
                licHtml = '<div class="empty-state"><i class="fas fa-key"></i><br>No tienes licencias activas<br><button class="btn-buy" onclick="comprarPlugin(PLUGINS[0])">Comprar licencia</button></div>';
            } else {
                for (let l of licencias) {
                    let plugin = PLUGINS.find(p => p.id === l.pluginId);
                    licHtml += `
                        <div class="plugin-card">
                            <div class="plugin-icon">🔑</div>
                            <div class="plugin-name">${plugin ? plugin.nombre : l.pluginId}</div>
                            <div class="plugin-desc">Código: <code>${l.codigo}</code></div>
                            <div class="plugin-desc">Comprado: ${new Date(l.fecha_compra).toLocaleDateString()}</div>
                            <div class="plugin-price">$${l.precio}</div>
                            <button class="btn-open" onclick="abrirAppInstalada('${l.pluginId}')">Abrir</button>
                        </div>
                    `;
                }
            }
            document.getElementById('contenidoDinamico').innerHTML = licHtml;
            return;
        }
        
        document.getElementById('contenidoDinamico').innerHTML = html;
    }
    
    function cambiarTab(tab) {
        tabActual = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
        renderizarPlugins();
    }
    
    // Exponer funciones globales
    window.PLUGINS = PLUGINS;
    window.comprarPlugin = comprarPlugin;
    window.procesarPago = procesarPago;
    window.activarDemo = activarDemo;
    window.abrirAppInstalada = abrirAppInstalada;
    window.desinstalarPlugin = desinstalarPlugin;
    window.mostrarInfoMonedas = mostrarInfoMonedas;
    window.cerrarModalPago = cerrarModalPago;
    window.cambiarTab = cambiarTab;
    
    // Inicialización
    document.addEventListener('DOMContentLoaded', () => {
        cargarDatos();
        renderizarPlugins();
        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => cambiarTab(t.getAttribute('data-tab'))));
    });
</script>
</body>
</html>
