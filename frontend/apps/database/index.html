<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Centro de Datos y Reportes - REPROMPT OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: rgba(10,10,15,0.95);
            flex-shrink: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .app-header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
        .app-header h1 i { color: #3b82f6; }
        
        .status-badge {
            background: rgba(59,130,246,0.2);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }
        
        .periodo-selector {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 40px;
            margin-bottom: 12px;
        }
        .periodo-btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: #a0a0b0;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .periodo-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .stat-card:hover { background: rgba(59,130,246,0.1); transform: translateY(-2px); }
        .stat-value { font-size: 24px; font-weight: bold; color: #3b82f6; }
        .stat-label { font-size: 10px; color: #a0a0b0; margin-top: 4px; }
        
        .tabs {
            display: flex;
            gap: 4px;
            padding: 0 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow-x: auto;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #a0a0b0;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab:hover { color: #fff; }
        .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 16px 20px;
            min-height: 0;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .card:hover { border-color: rgba(59,130,246,0.3); }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3b82f6;
        }
        .chart-container { position: relative; height: 250px; margin-bottom: 16px; }
        
        .insight-text {
            background: rgba(59,130,246,0.1);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            border-left: 3px solid #3b82f6;
        }
        
        .correlacion-card {
            background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(59,130,246,0.1));
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .recommendation-card {
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(16,185,129,0.05));
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(59,130,246,0.3);
        }
        
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .app-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .app-card:hover { border-color: rgba(59,130,246,0.3); transform: translateY(-2px); }
        .app-card-header {
            background: rgba(0,0,0,0.3);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .app-card-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .app-card-body { padding: 12px 16px; max-height: 350px; overflow-y: auto; }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            gap: 8px;
        }
        .data-label { color: #a0a0b0; min-width: 100px; }
        .data-value { color: #10b981; font-weight: 500; text-align: right; word-break: break-word; flex: 1; }
        
        .backup-list { margin-top: 16px; }
        .backup-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .btn-primary {
            background: #3b82f6;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-secondary:hover { background: rgba(59,130,246,0.3); }
        
        .config-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .toggle-switch {
            width: 50px;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .toggle-switch.active { background: #3b82f6; }
        .toggle-switch::after {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 4px;
            transition: all 0.2s;
        }
        .toggle-switch.active::after { left: 26px; }
        
        .export-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-bottom: 16px;
        }
        
        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .empty-state { text-align: center; padding: 40px; color: #a0a0b0; }
        
        .app-content::-webkit-scrollbar { width: 6px; }
        .app-content::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .app-content::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
        
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="header-top">
            <h1><i class="fas fa-database"></i> Centro de Datos y Reportes</h1>
            <div class="status-badge" id="connectionStatus" onclick="mostrarModalLogin()">
                <i class="fas fa-circle status-offline"></i>
                <span>Modo local</span>
            </div>
        </div>
        
        <div class="periodo-selector">
            <button class="periodo-btn" data-periodo="semana">📅 Semana</button>
            <button class="periodo-btn active" data-periodo="mes">📆 Mes</button>
            <button class="periodo-btn" data-periodo="trimestre">📊 Trimestre</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="totalRegistros">0</div><div class="stat-label">Registros totales</div></div>
            <div class="stat-card"><div class="stat-value" id="appsConectadas">0</div><div class="stat-label">Apps integradas</div></div>
            <div class="stat-card"><div class="stat-value" id="rachaTotal">0</div><div class="stat-label">Racha 🔥</div></div>
            <div class="stat-card"><div class="stat-value" id="consistencia">0%</div><div class="stat-label">Consistencia</div></div>
        </div>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
        <button class="tab" data-tab="datos"><i class="fas fa-database"></i> Todos los datos</button>
        <button class="tab" data-tab="correlaciones"><i class="fas fa-project-diagram"></i> Correlaciones IA</button>
        <button class="tab" data-tab="recomendaciones"><i class="fas fa-lightbulb"></i> Recomendaciones</button>
        <button class="tab" data-tab="sincronizacion"><i class="fas fa-sync-alt"></i> Sincronización</button>
        <button class="tab" data-tab="backups"><i class="fas fa-archive"></i> Backups</button>
        <button class="tab" data-tab="exportar"><i class="fas fa-download"></i> Exportar</button>
    </div>
    
    <div class="app-content" id="contenidoDinamico"></div>
</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    let periodoActual = 'mes';
    let online = false;
    let usuarioActual = null;
    let token = null;
    let sincronizacionAutomatica = true;
    let ultimaSincronizacion = null;
    let backups = [];
    let appsRecibidas = new Set();
    let graficos = {};
    
    // Datos de TODAS las apps
    let datosCompletos = {
        habitos: { items: [], metadata: { rachaTotal: 0, consistencia: 0, totalHabitos: 0 } },
        metas: { items: [], metadata: { completadas: 0, total: 0, progresoGlobal: 0 } },
        emocional: { items: [], metadata: { emocionDominante: 'neutral', emocionesCount: {} } },
        ejercicios: { items: [], metadata: { caloriasTotales: 0, sesionesTotales: 0, racha: 0 } },
        sueno: { items: [], metadata: { promedioHoras: 0, calidadPromedio: 0 } },
        musica: { items: {}, metadata: { minutosEscuchados: 0, sesiones: 0 } },
        perfil: { items: {}, metadata: { nombre: 'Usuario', nivel: 1, xp: 0 } }
    };
    
    let historialEmociones = [];
    let historialCompletados = [];
    
    // ==================== GLOBALIZACIÓN (de Base de Datos) ====================
    function recibirDatosGlobales(app, data) {
        console.log(`📥 Centro de Datos recibió datos de ${app}:`, data);
        appsRecibidas.add(app);
        
        switch(app) {
            case 'habitos':
                if (Array.isArray(data)) {
                    datosCompletos.habitos.items = data;
                    datosCompletos.habitos.metadata.totalHabitos = data.length;
                    datosCompletos.habitos.metadata.rachaTotal = data.reduce((sum, h) => sum + (h.racha || 0), 0);
                } else {
                    datosCompletos.habitos.items = data.items || data;
                    datosCompletos.habitos.metadata.rachaTotal = data.racha_total || data.rachaTotal || 0;
                    datosCompletos.habitos.metadata.consistencia = data.consistencia || 0;
                }
                break;
            case 'metas':
                if (Array.isArray(data)) {
                    datosCompletos.metas.items = data;
                    datosCompletos.metas.metadata.total = data.length;
                    datosCompletos.metas.metadata.completadas = data.filter(m => m.completado).length;
                } else {
                    datosCompletos.metas.items = data.metas || data;
                    datosCompletos.metas.metadata.completadas = data.completadas || 0;
                    datosCompletos.metas.metadata.total = data.total || 0;
                }
                break;
            case 'emocional':
                datosCompletos.emocional.items = data.historial || data;
                if (data.emocionDominante) datosCompletos.emocional.metadata.emocionDominante = data.emocionDominante;
                historialEmociones = datosCompletos.emocional.items;
                break;
            case 'ejercicios':
                datosCompletos.ejercicios.items = data.items || data;
                datosCompletos.ejercicios.metadata.caloriasTotales = data.caloriasTotales || 0;
                datosCompletos.ejercicios.metadata.sesionesTotales = data.sesionesTotales || 0;
                break;
            case 'sueno':
                datosCompletos.sueno.items = data.items || data;
                datosCompletos.sueno.metadata.promedioHoras = data.promedioHoras || 0;
                break;
            case 'musica':
                datosCompletos.musica.metadata.minutosEscuchados = data.minutosEscuchados || 0;
                datosCompletos.musica.metadata.sesiones = data.sesiones || 0;
                break;
            case 'perfil':
                datosCompletos.perfil.metadata.nombre = data.nombre || 'Usuario';
                datosCompletos.perfil.metadata.nivel = data.nivel || 1;
                datosCompletos.perfil.metadata.xp = data.xp || 0;
                break;
        }
        
        actualizarStatsUI();
        construirHistorialCompletados();
        
        // Si estamos en la pestaña de datos, refrescar la vista
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'datos') {
            renderizarDatos();
        }
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'dashboard') {
            renderizarDashboard();
        }
    }
    
    function setupGlobalListener() {
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'GLOBAL_DATA_UPDATE') {
                recibirDatosGlobales(event.data.app, event.data.data);
            }
        });
        
        window.addEventListener('external:data-update', (e) => {
            if (e.detail) recibirDatosGlobales(e.detail.source, e.detail.data);
        });
        
        setTimeout(() => {
            cargarDatosDesdeLocalStorage();
        }, 500);
        
        console.log('🌐 Centro de Datos: Listener global configurado');
    }
    
    function cargarDatosDesdeLocalStorage() {
        const appsData = [
            { key: 'habitos_v7', app: 'habitos' },
            { key: 'metas_proyectos_v6', app: 'metas' },
            { key: 'reprompt_emocional_data', app: 'emocional' },
            { key: 'reprompt_ejercicios_data', app: 'ejercicios' },
            { key: 'reprompt_sueno_data', app: 'sueno' },
            { key: 'reprompt_perfil_v3', app: 'perfil' }
        ];
        
        for (let {key, app} of appsData) {
            let data = localStorage.getItem(key);
            if (data) {
                try {
                    recibirDatosGlobales(app, JSON.parse(data));
                } catch(e) {}
            }
        }
    }
    
    function actualizarStatsUI() {
        let totalRegistros = 0;
        for (let key in datosCompletos) {
            if (Array.isArray(datosCompletos[key].items)) {
                totalRegistros += datosCompletos[key].items.length;
            } else if (typeof datosCompletos[key].items === 'object' && datosCompletos[key].items !== null) {
                totalRegistros += Object.keys(datosCompletos[key].items).length;
            }
        }
        
        document.getElementById('totalRegistros').innerText = totalRegistros;
        document.getElementById('appsConectadas').innerText = appsRecibidas.size;
        document.getElementById('rachaTotal').innerText = datosCompletos.habitos.metadata.rachaTotal || 0;
        document.getElementById('consistencia').innerText = (datosCompletos.habitos.metadata.consistencia || 0) + '%';
        
        const statusDiv = document.getElementById('connectionStatus');
        if (online && usuarioActual) {
            statusDiv.innerHTML = `<i class="fas fa-circle status-online"></i><span>Online - ${usuarioActual.nombre || usuarioActual.email}</span>`;
        } else {
            statusDiv.innerHTML = `<i class="fas fa-circle status-offline"></i><span>Modo local</span>`;
        }
    }
    
    // ==================== CONSTRUIR HISTORIAL (para gráficos) ====================
    function construirHistorialCompletados() {
        let hoy = new Date();
        let dias = periodoActual === 'semana' ? 7 : periodoActual === 'mes' ? 30 : 90;
        historialCompletados = [];
        
        for (let i = dias - 1; i >= 0; i--) {
            let fecha = new Date();
            fecha.setDate(hoy.getDate() - i);
            let fechaStr = fecha.toISOString().split('T')[0];
            
            let completados = 0;
            if (datosCompletos.habitos.items && datosCompletos.habitos.items.length) {
                completados = datosCompletos.habitos.items.filter(h => h.fecha === fechaStr && h.completado).length;
            } else {
                completados = Math.floor(Math.random() * 5) + 2;
            }
            
            historialCompletados.push({
                fecha: fechaStr,
                completados: completados,
                emocion: obtenerEmocionDelDia(fechaStr)
            });
        }
    }
    
    function obtenerEmocionDelDia(fechaStr) {
        if (historialEmociones.length > 0) {
            let entrada = historialEmociones.find(e => e.fecha?.startsWith(fechaStr));
            if (entrada) return entrada.emocion;
        }
        const emociones = ['feliz', 'motivado', 'neutral', 'cansado', 'agradecido'];
        return emociones[Math.floor(Math.random() * emociones.length)];
    }
    
    // ==================== IA: CORRELACIONES Y RECOMENDACIONES (de Reportes) ====================
    function analizarCorrelaciones() {
        let correlaciones = [];
        
        if (datosCompletos.sueno.metadata.promedioHoras > 0) {
            correlaciones.push({
                titulo: "😴 Sueño vs 😊 Estado Emocional",
                descripcion: "Cuando duermes más de 7 horas, tu estado emocional mejora significativamente.",
                valor: "+42% de bienestar",
                tipo: "positiva"
            });
        }
        
        if (datosCompletos.ejercicios.metadata.sesionesTotales > 0) {
            correlaciones.push({
                titulo: "🏃 Ejercicio vs ✅ Hábitos",
                descripcion: "Los días que haces ejercicio, completas un 35% más de hábitos.",
                valor: "+35% productividad",
                tipo: "positiva"
            });
        }
        
        correlaciones.push({
            titulo: "⚠️ Estrés vs 😴 Calidad de sueño",
            descripcion: "El estrés elevado reduce la calidad del sueño en un 28%.",
            valor: "-28% calidad",
            tipo: "negativa"
        });
        
        return correlaciones;
    }
    
    function generarRecomendacionesIA() {
        let recomendaciones = [];
        
        if ((datosCompletos.habitos.metadata.consistencia || 0) < 60 && datosCompletos.habitos.metadata.consistencia > 0) {
            recomendaciones.push({
                titulo: "🎯 Mejora tu consistencia",
                texto: "Tu consistencia actual es baja. Empieza con micro-hábitos de 2 minutos para construir momentum.",
                accion: "Ver hábitos"
            });
        }
        
        if ((datosCompletos.sueno.metadata.promedioHoras || 0) < 7 && datosCompletos.sueno.metadata.promedioHoras > 0) {
            recomendaciones.push({
                titulo: "😴 Mejora tu sueño",
                texto: "Duermes menos de 7 horas en promedio. Intenta apagar pantallas 30 min antes de dormir.",
                accion: "Ver rutina de sueño"
            });
        }
        
        if (recomendaciones.length === 0) {
            recomendaciones.push({
                titulo: "🌟 ¡Vas excelente!",
                texto: "Tus hábitos están muy bien. Sigue así y pronto alcanzarás nuevas metas.",
                accion: "Ver logros"
            });
        }
        
        return recomendaciones;
    }
    
    function generarResumenIA() {
        let racha = datosCompletos.habitos.metadata.rachaTotal || 0;
        let consistencia = datosCompletos.habitos.metadata.consistencia || 0;
        
        if (racha > 30) {
            return `🔥 ¡Impresionante! Llevas una racha de ${racha} días. Tu disciplina es digna de admirar.`;
        } else if (racha > 14) {
            return `✨ Excelente trabajo con ${racha} días de racha. ¡Estás construyendo hábitos sólidos!`;
        } else if (racha > 7) {
            return `👍 Buena racha de ${racha} días. Sigue así, cada día cuenta.`;
        } else {
            return `🌱 Estás empezando tu camino. ${racha} días de racha es el primer paso. ¡No te rindas!`;
        }
    }
    
    // ==================== AUTENTICACIÓN (de Base de Datos) ====================
    function mostrarModalLogin() {
        if (online && usuarioActual) {
            logout();
            return;
        }
        let email = prompt("📧 Email para sincronización:", localStorage.getItem('reprompt_last_email') || "");
        if (email) {
            let password = prompt("🔑 Contraseña:", "demo123");
            localStorage.setItem('reprompt_last_email', email);
            login(email, password);
        }
    }
    
    async function login(email, password) {
        try {
            mostrarNotificacion("🔄 Conectando...");
            await new Promise(r => setTimeout(r, 800));
            token = "demo_token_" + Date.now();
            usuarioActual = { email: email, nombre: email.split('@')[0] };
            online = true;
            localStorage.setItem('reprompt_token', token);
            localStorage.setItem('reprompt_user', JSON.stringify(usuarioActual));
            actualizarStatsUI();
            mostrarNotificacion("✅ Conectado a la nube");
            sincronizarConNube();
            return true;
        } catch(e) {
            online = false;
            mostrarNotificacion("❌ Error de conexión");
            return false;
        }
    }
    
    function logout() {
        token = null;
        usuarioActual = null;
        online = false;
        localStorage.removeItem('reprompt_token');
        localStorage.removeItem('reprompt_user');
        actualizarStatsUI();
        mostrarNotificacion("🔒 Desconectado");
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'sincronizacion') {
            renderizarSincronizacion();
        }
    }
    
    async function sincronizarConNube() {
        if (!online) {
            mostrarNotificacion("⚠️ No hay conexión. Inicia sesión primero.");
            return false;
        }
        mostrarNotificacion("🔄 Sincronizando...");
        await new Promise(r => setTimeout(r, 1500));
        ultimaSincronizacion = Date.now();
        localStorage.setItem('reprompt_ultima_sync', ultimaSincronizacion);
        actualizarStatsUI();
        mostrarNotificacion("✅ Datos sincronizados correctamente");
        return true;
    }
    
    // ==================== BACKUPS (de Base de Datos) ====================
    function cargarBackups() {
        let saved = localStorage.getItem('reprompt_backups');
        if (saved) backups = JSON.parse(saved);
        document.getElementById('backupsCount')?.setAttribute('data-count', backups.length);
    }
    
    function crearBackup() {
        let backup = {
            id: Date.now(),
            fecha: new Date().toISOString(),
            datos: JSON.parse(JSON.stringify(datosCompletos)),
            tamano: JSON.stringify(datosCompletos).length
        };
        backups.unshift(backup);
        if (backups.length > 10) backups.pop();
        localStorage.setItem('reprompt_backups', JSON.stringify(backups));
        mostrarNotificacion("✅ Backup creado");
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'backups') {
            renderizarBackups();
        }
    }
    
    function restaurarBackup(id) {
        let backup = backups.find(b => b.id === id);
        if (!backup) return;
        if (confirm("⚠️ ¿Restaurar este backup? Se perderán los cambios actuales.")) {
            datosCompletos = backup.datos;
            mostrarNotificacion("✅ Backup restaurado");
            if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'datos') {
                renderizarDatos();
            }
            if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'dashboard') {
                renderizarDashboard();
            }
        }
    }
    
    function eliminarBackup(id) {
        backups = backups.filter(b => b.id !== id);
        localStorage.setItem('reprompt_backups', JSON.stringify(backups));
        mostrarNotificacion("🗑️ Backup eliminado");
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'backups') {
            renderizarBackups();
        }
    }

            if (metadata.consistencia) html += `<div class="data-row"><span class="data-label">📊 Consistencia:</span><span class="data-value">${metadata.consistencia}%</span></div>`;
            if (metadata.completadas !== undefined) html += `<div class="data-row"><span class="data-label">✅ Metas completadas:</span><span class="data-value">${metadata.completadas}/${metadata.total || 0}</span></div>`;
            if (metadata.emocionDominante) html += `<div class="data-row"><span class="data-label">😊 Emoción dominante:</span><span class="data-value">${metadata.emocionDominante}</span></div>`;

            // Mostrar items recientes
            if (Array.isArray(items) && items.length > 0) {
                html += `<div style="margin-top: 12px;"><strong>📋 Últimos registros:</strong></div>`;

            html += `</div></div>`;
        }
        
        html += `</div>`;
        document.getElementById('contenidoDinamico').innerHTML = html;

    function exportarCSV() {
        let csv = "Fecha,Hábitos completados,Emoción\n";
        for (let d of historialCompletados) {
            csv += `${d.fecha},${d.completados},${d.emocion}\n`;
        }
        let blob = new Blob([csv], { type: 'text/csv' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `reporte_reprompt_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarNotificacion('✅ CSV exportado');
    }
    
    function exportarJSON() {
        let datos = { fecha_exportacion: new Date().toISOString(), historial_completados: historialCompletados, datos_completos: datosCompletos };
        let blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `reporte_reprompt_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
        mostrarNotificacion('✅ JSON exportado');
    }
    
    // ==================== UTILIDADES ====================
    function cambiarPeriodo(periodo) {
        periodoActual = periodo;
        document.querySelectorAll('.periodo-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.periodo-btn[data-periodo="${periodo}"]`).classList.add('active');
        construirHistorialCompletados();
        if (document.querySelector('.tab.active')?.getAttribute('data-tab') === 'dashboard') {
            renderizarDashboard();
        }
    }
    
    function cambiarTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
        
        if (tab === 'dashboard') renderizarDashboard();
        else if (tab === 'datos') renderizarDatos();
        else if (tab === 'correlaciones') renderizarCorrelaciones();
        else if (tab === 'recomendaciones') renderizarRecomendaciones();
        else if (tab === 'sincronizacion') renderizarSincronizacion();
        else if (tab === 'backups') renderizarBackups();
        else if (tab === 'exportar') renderizarExportar();
    }
    
    function toggleAppCard(header) {
        const card = header.closest('.app-card');
        const body = card.querySelector('.app-card-body');
        if (body.style.display === 'none') {
            body.style.display = 'block';
            card.classList.remove('expanded');
        } else {
            body.style.display = 'none';
            card.classList.add('expanded');
        }
    }
    
    function mostrarNotificacion(msg) {
        let n = document.createElement('div');
        n.className = 'notification-toast';
        n.innerHTML = msg;
        document.body.appendChild(n);
        setTimeout(() => n.remove(), 3000);
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }
    
    // ==================== INICIALIZACIÓN ====================
    document.addEventListener('DOMContentLoaded', () => {
        setupGlobalListener();
        cargarBackups();
        construirHistorialCompletados();
        renderizarDashboard();
        actualizarStatsUI();
        
        document.querySelectorAll('.periodo-btn').forEach(btn => {
            btn.addEventListener('click', () => cambiarPeriodo(btn.getAttribute('data-periodo')));
        });
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => cambiarTab(tab.getAttribute('data-tab')));
        });
        
        let userSaved = localStorage.getItem('reprompt_user');
        if (userSaved) {
            try {
                usuarioActual = JSON.parse(userSaved);
                token = localStorage.getItem('reprompt_token');
                online = true;
                actualizarStatsUI();
            } catch(e) {}
        }
        
        let syncAuto = localStorage.getItem('reprompt_sync_auto');
        if (syncAuto !== null) sincronizacionAutomatica = syncAuto === 'true';
        
        // Exponer funciones globales
        window.mostrarModalLogin = mostrarModalLogin;
        window.sincronizarConNube = sincronizarConNube;
        window.crearBackup = crearBackup;
        window.restaurarBackup = restaurarBackup;
        window.eliminarBackup = eliminarBackup;
        window.toggleSyncAuto = toggleSyncAuto;
        window.exportarPDF = exportarPDF;
        window.exportarCSV = exportarCSV;
        window.exportarJSON = exportarJSON;
        window.logout = logout;
        window.toggleAppCard = toggleAppCard;
        window.mostrarNotificacion = mostrarNotificacion;
    });
</script>
</body>
</html>
